name = "qmind-api"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Nightly PubMed search for the Related articles page, 02:15 UTC.
[triggers]
crons = ["15 2 * * *"]

[vars]
# Comma-separated list of sites that may call this API, e.g. "https://<user>.github.io". "*" allows any site.
ALLOWED_ORIGINS = "https://msk-imaging-and-novel-diagnostics.github.io"

[[d1_databases]]
binding = "DB"
database_name = "qmind"
database_id = "af252671-f3b1-43a7-b85c-558f63da6c1f"
